<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Android · Ventana flotante «Hey Miku»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&amp;family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Zen Kaku Gothic New','Yu Gothic','Segoe UI',sans-serif;color:#EAF4F3;background:#0d1013}
a{color:#39C5BB}a:hover{color:#7FE3DA}
.lbl{font-family:'Chakra Petch','Bahnschrift',monospace;font-size:11px;font-weight:600;letter-spacing:.12em}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:#F1F3F4}
.app{position:absolute;inset:0;box-sizing:border-box;padding:70px 20px;display:flex;flex-direction:column;gap:16px}
.blk{border-radius:14px;background:#DDE2E5}
.shade{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(to top,rgba(5,10,12,.55),rgba(5,10,12,0))}
.card{position:absolute;left:12px;right:12px;bottom:28px;box-sizing:border-box;padding:16px 16px 18px 16px;display:flex;flex-direction:column;gap:14px;background:rgba(9,20,23,.97);border:1px solid rgba(57,197,187,.35);border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.45)}
.top{display:flex;align-items:center;gap:12px}
.x{width:44px;height:44px;margin-left:auto;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(234,244,243,.06);border:0;border-radius:50%;color:#9DB9B6}
</style>
</helmet>
<div style="width: 1250px; height: 880px; display: flex; gap: 40px; background: #0d1013">

<div style="display: flex; flex-direction: column; gap: 12px">
<span class="lbl" style="height: 16px; color: #9DB9B6"><span style="color: #F0508F">1</span> · ESCUCHANDO</span>
<div class="phone">
<div class="app"><div class="blk" style="height: 44px; width: 60%"></div><div class="blk" style="height: 160px"></div><div class="blk" style="height: 70px"></div><div class="blk" style="height: 70px"></div></div>
<div class="shade"></div>
<div class="card" role="dialog" aria-label="Miku">
<div class="top">
<span style="display: flex; border-radius: 50%; box-shadow: 0 0 0 5px rgba(240,80,143,0.3), 0 0 0 11px rgba(240,80,143,0.12)"><svg width="48" height="48" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="54" fill="#0E1D20" stroke="#F0508F" stroke-width="3"></rect><g transform="translate(54 54) rotate(-30) scale(0.85) translate(-54 -54)"><rect x="47" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(-16 54 56)"></rect><rect x="52" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(16 54 56)"></rect><rect x="49" y="20" width="10" height="38" rx="5" fill="#39C5BB"></rect><rect x="48" y="54" width="12" height="30" rx="6" fill="#EAF4F3"></rect><rect x="46.5" y="52" width="15" height="6" rx="3" fill="#F0508F"></rect></g></svg></span>
<span class="lbl" style="color: #F58AB3">ESCUCHANDO</span>
<button class="x" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500">recuérdame a las nueve <span style="color: #7E9B98; font-weight: 400">llamar al técnico</span></p>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span class="lbl" style="height: 16px; color: #9DB9B6"><span style="color: #F0508F">2</span> · PENSANDO</span>
<div class="phone">
<div class="app"><div class="blk" style="height: 44px; width: 60%"></div><div class="blk" style="height: 160px"></div><div class="blk" style="height: 70px"></div><div class="blk" style="height: 70px"></div></div>
<div class="shade"></div>
<div class="card" role="dialog" aria-label="Miku">
<div class="top">
<span style="display: flex; border-radius: 50%; box-shadow: 0 0 0 5px rgba(57,197,187,0.25)"><svg width="48" height="48" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="54" fill="#0E1D20" stroke="#39C5BB" stroke-width="3"></rect><g transform="translate(54 54) rotate(-30) scale(0.85) translate(-54 -54)"><rect x="47" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(-16 54 56)"></rect><rect x="52" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(16 54 56)"></rect><rect x="49" y="20" width="10" height="38" rx="5" fill="#39C5BB"></rect><rect x="48" y="54" width="12" height="30" rx="6" fill="#EAF4F3"></rect><rect x="46.5" y="52" width="15" height="6" rx="3" fill="#F0508F"></rect></g></svg></span>
<span class="lbl" style="color: #39C5BB">PENSANDO</span>
<button class="x" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; font-size: 14px; color: #9DB9B6"><span class="lbl" style="color: #F58AB3">TÚ · </span>recuérdame a las nueve llamar al técnico</p>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(57,197,187,0.25); border-top-color: #39C5BB"></span><span class="lbl" style="width: 96px; font-size: 10px; color: #7E9B98">PENDIENTES</span><span>Anotando…</span></div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span class="lbl" style="height: 16px; color: #9DB9B6"><span style="color: #F0508F">3</span> · RESPONDIENDO</span>
<div class="phone">
<div class="app"><div class="blk" style="height: 44px; width: 60%"></div><div class="blk" style="height: 160px"></div><div class="blk" style="height: 70px"></div><div class="blk" style="height: 70px"></div></div>
<div class="shade"></div>
<div class="card" role="dialog" aria-label="Miku">
<div class="top">
<svg width="48" height="48" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="54" fill="#0E1D20" stroke="rgba(57,197,187,0.45)" stroke-width="3"></rect><g transform="translate(54 54) rotate(-30) scale(0.85) translate(-54 -54)"><rect x="47" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(-16 54 56)"></rect><rect x="52" y="26" width="9" height="32" rx="4.5" fill="#2A9D95" transform="rotate(16 54 56)"></rect><rect x="49" y="20" width="10" height="38" rx="5" fill="#39C5BB"></rect><rect x="48" y="54" width="12" height="30" rx="6" fill="#EAF4F3"></rect><rect x="46.5" y="52" width="15" height="6" rx="3" fill="#F0508F"></rect></g></svg>
<span class="lbl" style="color: #39C5BB">MIKU</span>
<button class="x" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.45; font-weight: 500">¡Hecho! Mañana a las nueve te recuerdo llamar al <span style="color: #39C5BB; border-bottom: 3px solid #F0508F">técnico.</span></p>
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="flex-grow: 1; display: flex; align-items: flex-end; gap: 2px; height: 14px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="24"><span style="flex: 1 1 0; height: {{k.h}}px; border-radius: 1.5px; background: {{k.bg}}"></span></sc-for>
</div>
<button aria-label="Detener" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; background: #EAF4F3; border: 0; border-radius: 50%; color: #12161a"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
</div>
<a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 14px; text-decoration: none">Abrir el chat<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const pat = [0,1,0,1,0,0,1,0,1,0,1,0];
    const keys = [];
    for (let i = 0; i < 24; i++) {
      const black = pat[i % 12] === 1;
      const on = i < 15;
      keys.push({ h: black ? 9 : 14, bg: on ? (black ? '#B83A6C' : '#F0508F') : (black ? 'rgba(157,185,182,0.22)' : 'rgba(234,244,243,0.12)') });
    }
    return { keys };
  }
}
</script>
</body>
</html>
