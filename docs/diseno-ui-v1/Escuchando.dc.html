<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Miku · Escuchando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&amp;family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Zen Kaku Gothic New','Yu Gothic','Segoe UI',sans-serif;color:#EAF4F3;background:#12161a}
a{color:#39C5BB}a:hover{color:#7FE3DA}
input::placeholder{color:#7E9B98}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
</style>
</helmet>
<div style="position: relative; width: 750px; height: 720px; overflow: hidden; background-color: #12161a; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 24px 24px">

<header style="position: absolute; left: 0; top: 0; width: 750px; height: 40px; box-sizing: border-box; padding: 0 4px 0 14px; display: flex; align-items: center; justify-content: space-between; background: rgba(9,20,23,0.92); border-bottom: 1px solid rgba(57,197,187,0.3)">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-family: 'Dela Gothic One','Arial Black',sans-serif; font-size: 15px; letter-spacing: 0.08em; color: #39C5BB">MIKU</span>
<span style="font-family: 'Chakra Petch','Bahnschrift',monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #F0508F">CH·01</span>
</div>
<div style="width: 1px; height: 18px; background: rgba(57,197,187,0.3)"></div>
<div style="display: flex; align-items: center; gap: 7px; font-family: 'Chakra Petch','Bahnschrift',monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #9DB9B6">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #F0508F; animation: breathe 1.2s ease-in-out infinite"></span>
<span style="color: #EAF4F3">ESCUCHANDO</span>
</div>
<div style="display: flex; align-items: center; gap: 7px; padding: 3px 9px; border: 1px solid rgba(240,80,143,0.45); border-radius: 999px; font-family: 'Chakra Petch','Bahnschrift',monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #F58AB3">
<span>ÁNIMO</span>
<span style="color: #EAF4F3">CONTENTA</span>
</div>
</div>
<nav aria-label="Controles de la ventana" style="display: flex; align-items: center; gap: 0">
<button aria-label="Apps y carpetas" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"></rect><rect x="14" y="4" width="6" height="6" rx="1.5"></rect><rect x="4" y="14" width="6" height="6" rx="1.5"></rect><rect x="14" y="14" width="6" height="6" rx="1.5"></rect></svg></button>
<button aria-label="Memoria" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5c-3-.5-6 0-8 1.5z"></path><path d="M12 6v13.5"></path></svg></button>
<button aria-label="Configuración" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
<button aria-label="Silenciar voz" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z"></path><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
<div style="width: 1px; height: 18px; margin: 0 4px; background: rgba(57,197,187,0.3)"></div>
<button aria-label="Minimizar" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
<button aria-label="Cerrar" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 10px; color: #9DB9B6; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</nav>
</header>

<div style="position: absolute; left: 215px; top: 512px; width: 320px; height: 60px; box-sizing: border-box; border: 1.5px solid rgba(57,197,187,0.45); border-radius: 50%"></div>
<div style="position: absolute; left: 265px; top: 525px; width: 220px; height: 34px; box-sizing: border-box; border: 1px solid rgba(57,197,187,0.25); border-radius: 50%"></div>
<div style="position: absolute; left: 245px; top: 70px; width: 260px; height: 470px; box-sizing: border-box; border: 1.5px dashed rgba(157,185,182,0.35); border-radius: 130px 130px 28px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<span style="font-family: 'Chakra Petch','Bahnschrift',monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #7E9B98">AVATAR 3D · VRM</span>
<span style="font-size: 13px; color: #7E9B98">Zona de tacto</span>
</div>

<div aria-live="polite" style="position: absolute; left: 40px; top: 452px; width: 670px; box-sizing: border-box; padding: 14px 20px 16px 20px; display: flex; flex-direction: column; gap: 8px; background: rgba(9,20,23,0.88); border: 1px solid rgba(240,80,143,0.35); border-radius: 18px">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Chakra Petch','Bahnschrift',monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em">
<span style="color: #F58AB3">TÚ</span>
<span style="color: #7E9B98">· SE CORTA SOLO CUANDO TERMINAS DE HABLAR</span>
</div>
<p style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 500; color: #EAF4F3; text-wrap: pretty">Hey Miku, pon algo tranquilo en Spotify <span style="color: #7E9B98; font-weight: 400">mientras termino esto</span></p>
</div>

<section aria-label="Hablar con Miku" style="position: absolute; left: 20px; top: 596px; width: 710px; height: 104px; box-sizing: border-box; padding: 12px 14px 14px 14px; display: flex; flex-direction: column; gap: 10px; background: rgba(9,20,23,0.92); border: 1px solid rgba(57,197,187,0.3); border-radius: 22px">
<div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 12px; padding: 0 4px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="36">
<span style="flex: 1 1 0; height: {{k.h}}px; border-radius: 2px; background: {{k.bg}}"></span>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Adjuntar imagen o archivo" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 1px solid rgba(157,185,182,0.25); border-radius: 14px; color: #9DB9B6; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"></path></svg></button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mensaje para Miku</label>
<input id="msg" type="text" disabled placeholder="Escuchando…" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 0 16px; font-family: 'Zen Kaku Gothic New','Yu Gothic','Segoe UI',sans-serif; font-size: 15px; color: #EAF4F3; background: rgba(234,244,243,0.05); border: 1px solid rgba(157,185,182,0.2); border-radius: 14px; outline: none">
<button aria-label="Dejar de escuchar" aria-pressed="true" style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; background: #F0508F; border: 0; border-radius: 50%; color: #2A0714; cursor: pointer; box-shadow: 0 0 0 5px rgba(240,80,143,0.22), 0 0 0 11px rgba(240,80,143,0.08)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":750,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const pat = [0,1,0,1,0,0,1,0,1,0,1,0];
    const keys = [];
    for (let i = 0; i < 36; i++) {
      const black = pat[i % 12] === 1;
      const lvl = Math.sin(i * 0.55) + Math.sin(i * 0.21 + 1) * 0.8;
      const on = lvl > 0.2;
      keys.push({ h: black ? 7 : 11, bg: on ? (black ? '#2A8F88' : '#39C5BB') : (black ? 'rgba(157,185,182,0.22)' : 'rgba(234,244,243,0.12)') });
    }
    return { keys };
  }
}
</script>
</body>
</html>
